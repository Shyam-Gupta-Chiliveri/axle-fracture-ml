name: CD

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and train the image model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/train.py --config configs/ci.yaml
      - name: Build the image
        run: docker build -t axle-fracture-ml:ci .
      - name: Smoke test the service
        run: |
          docker run -d --name axle-ml -p 8080:8080 axle-fracture-ml:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS -X POST http://127.0.0.1:8080/predict \
            -H 'content-type: application/json' \
            -d '{"mean_hv10": 520}'
          docker stop axle-ml
