[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axle-fracture-ml"
version = "1.0.0"
description = "Reproducible ductility models for 4Cr13 axle tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.0",
  "mlflow>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
